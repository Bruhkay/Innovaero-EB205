# Fuselage geometry and sidewall build-up shared by all solutions.

radius:
  value: 2.885
  unit: m
  source: LIT
  note: "Half of the 787 fuselage external width 5.77 m (cross-section is slightly taller than wide)"
  verify: "In 3.4, a = 2.885 m is based on what?"

frame_pitch:
  value: 0.533
  unit: m
  source: ASM
  note: "21 in. No public 787 value found; one Boeing composite-frame patent mentions 28-38 in"
  verify: "What are frames every 0.533 m and stringers every 0.2 m based on?"

stringer_pitch:
  value: 0.200
  unit: m
  source: ASM
  note: "No public 787 value found"
  verify: "What are frames every 0.533 m and stringers every 0.2 m based on?"

floor_height:
  value: -0.85
  unit: m
  source: ASM
  note: "Cabin floor z position relative to the fuselage axis"

cabin_section_x:
  value: [-14.0, -4.0]
  unit: m
  source: ASM
  note: "Axial extent of the VIP section (negative = forward of the fan face)"

sidewall_depth:
  value: 0.125
  unit: m
  source: DOC
  note: "Skin-to-trim distance d"
  verify: "Is d = 0.125m accurate? Is it a 12.5 cm wall?"

trim_panel_size:
  value: [1.066, 0.80]
  unit: m
  source: ASM
  note: "One trim panel spans two frame bays (axial) x 0.8 m (circumferential). Also used as the radiating panel size for spatial windowing"

pressurised_skin_tension:
  value: true
  unit: "-"
  source: ASM
  note: "Skin carries the full membrane load from cabin pressure: N_hoop = dp R, N_axial = dp R / 2"
