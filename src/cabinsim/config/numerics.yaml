# Numerical resolution. These are not physics; they trade accuracy for run time.

bands:
  value: [50, 63, 80, 100, 125, 160, 200, 250, 315, 400, 500, 630, 800, 1000, 1250, 1600, 2000, 2500, 3150, 4000, 5000]
  unit: Hz
  source: LIT
  note: "1/3-octave band centres, IEC 61260-1"

panel_length:
  value: 0.25
  unit: m
  source: ASM
  note: "Axial size of the projection panels on the fuselage"

panel_angle:
  value: 4.0
  unit: deg
  source: ASM
  note: "Circumferential size of the projection panels"

subfrequencies_per_band:
  value: 3
  unit: "-"
  source: ASM
  note: "Frequencies averaged (energy) inside each 1/3-octave band"

incidence_angles:
  value: 24
  unit: "-"
  source: ASM
  note: "Number of polar angles (0-89 deg) in the transmission tables"

azimuth_angles:
  value: 7
  unit: "-"
  source: ASM
  note: "Number of in-plane angles (0-90 deg, axial to circumferential) in the transmission tables"

bridge_incidence_angles:
  value: 181
  unit: "-"
  source: ASM
  note: "Polar angles for the diffuse skin-velocity average that calibrates the bridge path (resolves the narrow skin coincidence peak; 91 vs 181 differ by < 1 dB)"

window_quadrature:
  value: [40, 80]
  unit: "-"
  source: ASM
  note: "Minimum (polar, azimuth) quadrature points for the windowed radiation efficiency; raised automatically at high k*L"

tbl_wavenumbers:
  value: 1000
  unit: "-"
  source: ASM
  note: "Radial wavenumber points for the TBL wavenumber integral (800 vs 2500 points differ by < 0.02 dB)"

tbl_directions:
  value: 16
  unit: "-"
  source: ASM
  note: "Directions in the TBL wavenumber integral (16 vs 48 differ by < 0.02 dB)"

bay_modes_axial:
  value: 12
  unit: "-"
  source: ASM
  note: "Highest axial mode index in the skin bay model"

bay_modes_circumferential:
  value: 5
  unit: "-"
  source: ASM
  note: "Highest circumferential mode index in the skin bay model"

bay_grid:
  value: [28, 12]
  unit: "-"
  source: ASM
  note: "Rayleigh integration grid on the bay"

shunt_max_frequency:
  value: 2500.0
  unit: Hz
  source: ASM
  note: "Above this band the shunt effect is taken as zero (bay model grid limit)"

shunt_incidence_angles:
  value: [6, 3]
  unit: "-"
  source: ASM
  note: "(polar, azimuth) angles for the diffuse-field average in the bay model"
